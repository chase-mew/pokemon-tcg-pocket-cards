[project]
name = "pokemon-tcg-pocket-cards"
version = "5.1.0"
description = "Scraper pipeline for the Pokémon TCG Pocket card database"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests", "scripts/utils.py", "scripts/deck_code.py"]
addopts = "--doctest-modules"
pythonpath = ["scripts", "."]
